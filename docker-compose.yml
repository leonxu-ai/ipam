version: '3.8'

services:
  # PostgreSQL 数据库
  db:
    image: postgres:15-alpine
    container_name: ipam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipam}
      POSTGRES_USER: ${POSTGRES_USER:-ipam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipam_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipam} -d ${POSTGRES_DB:-ipam}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipam-network

  # Redis 缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: ipam-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipam-network

  # Django Web 应用
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipam-web
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ipam}:${POSTGRES_PASSWORD:-ipam_secret_2024}@db:5432/${POSTGRES_DB:-ipam}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,10.21.111.129}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://10.21.111.129,http://localhost}
    volumes:
      - ./backend:/app
      - static_files:/app/staticfiles
      - ./secrets:/app/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn ipam_project.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120"
    networks:
      - ipam-network

  # Django-Q2 任务队列 Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipam-worker
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ipam}:${POSTGRES_PASSWORD:-ipam_secret_2024}@db:5432/${POSTGRES_DB:-ipam}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py qcluster
    networks:
      - ipam-network

  # Nginx 反向代理（生产环境可选）
  nginx:
    image: nginx:alpine
    container_name: ipam-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      - web
    networks:
      - ipam-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local

networks:
  ipam-network:
    driver: bridge
